[package]
name = "wat_service"
version = "0.11.0"
description = "WebAssembly Text Format language service."
authors = ["Pig Fang <g-plane@hotmail.com>"]
repository = "https://github.com/g-plane/wasm-language-tools"
license = "MIT"
edition = "2024"
keywords = ["wasm"]
exclude = ["/tests"]

[dependencies]
bumpalo = { workspace = true }
hashbrown = { workspace = true }
indexmap = "2.14"
itertools = "0.15"
line-index = "0.1"
log = { workspace = true }
lspt = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
salsa = { version = "0.28", default-features = false, features = ["macros", "inventory"] }
serde = { workspace = true }
serde_json = { workspace = true }
similar = "3.1"
smallvec = { version = "1.15", features = ["const_generics", "union"] }
wat_formatter = { workspace = true }
wat_parser = { workspace = true }
wat_syntax = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "unchanged"
harness = false
[[bench]]
name = "changed"
harness = false
[[bench]]
name = "diagnostics"
harness = false
