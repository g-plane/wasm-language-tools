name: benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch criterion to codspeed-criterion-compat
        shell: pwsh
        run: |
          $path = "Cargo.toml"
          $contents = Get-Content -Path $path -Raw
          $old = 'criterion = "0.8"'
          $new = 'criterion = { package = "codspeed-criterion-compat", version = "=5.0.1" }'
          $contents = $contents.Replace($old, $new)
          Set-Content -Path $path -Value $contents
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: |
          cargo binstall -y cargo-codspeed
          cargo codspeed build
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
